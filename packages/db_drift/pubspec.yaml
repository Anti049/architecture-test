name: db_drift
publish_to: none
environment:
  sdk: ^3.6.0
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  core_domain:
    path: ../core_domain
  drift: ^2.35.0
  # drift_flutter 0.2.4 pins sqlite3 ^2.x, which conflicts with drift 2.35's
  # requirement of sqlite3 ^3.4.0. 0.3.1 depends on sqlite3 3.x and matches drift 2.35.
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.35.0

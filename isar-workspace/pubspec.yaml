name: architecture_test_isar_workspace
publish_to: none

environment:
  sdk: ^3.6.0

# WORKSPACE 2 (Isar / pinned older codegen stack).
# This workspace stays ISOLATED from the main one so isar_community_generator
# (analyzer ^6.9.0 <7.0.0) never has to co-resolve with Freezed 3.x.
# The Isar packages are managed by Melos rather than a Dart pub workspace so
# db_isar, AutoRoute v8, and dart_mappable can keep separate dev-dependency
# graphs inside the same isolated subtree.

dev_dependencies:
  melos: ^6.3.0

name: architecture_test_workspace
publish_to: none

environment:
  sdk: ^3.6.0

# WORKSPACE 1 (main / latest stack).
# The Isar apps live in ./isar-workspace with their OWN workspace root because
# isar_community_generator (analyzer <7) cannot co-resolve with Freezed 3.x /
# current build_runner (analyzer 12-14).
workspace:
  - packages/core_domain
  - packages/core_ui
  - packages/feature_splash
  - packages/feature_auth
  - packages/feature_library
  - packages/feature_updates
  - packages/feature_history
  - packages/feature_browse
  - packages/feature_more
  - packages/nav_contract
  - packages/nav_gorouter
  - packages/nav_autoroute
  - packages/db_drift
  - packages/db_sqflite
  - packages/model_freezed
  - packages/model_mappable
  - packages/model_plain
  - apps/app_baseline
  - apps/app_sqflite
  - apps/app_bloc
  - apps/app_mappable
  - apps/app_no_immutable
  - apps/app_autoroute

dev_dependencies:
  melos: ^6.3.0

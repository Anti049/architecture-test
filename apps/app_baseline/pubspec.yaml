name: app_baseline
description: Baseline permutation (Drift + Riverpod + Freezed + GoRouter).
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.6.0
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  core_domain:
    path: ../../packages/core_domain
  nav_contract:
    path: ../../packages/nav_contract
  feature_splash:
    path: ../../packages/feature_splash
  feature_auth:
    path: ../../packages/feature_auth
  feature_library:
    path: ../../packages/feature_library
  feature_updates:
    path: ../../packages/feature_updates
  feature_history:
    path: ../../packages/feature_history
  feature_browse:
    path: ../../packages/feature_browse
  feature_more:
    path: ../../packages/feature_more
  # chosen implementations
  db_drift:
    path: ../../packages/db_drift
  model_freezed:
    path: ../../packages/model_freezed
  nav_gorouter:
    path: ../../packages/nav_gorouter
  # third-party
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  shared_preferences: ^2.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
